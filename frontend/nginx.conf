# =============================================================================
#  FinRAG 前端 Nginx 配置
#  1) SPA 静态托管（前端用 hash 路由，回退到 index.html 依然安全）
#  2) /api 反代到后端容器 backend:8000（compose 服务名）
#  3) SSE 关键：关闭代理缓冲，否则流式回答会被攒批
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # ---- 静态资源缓存（Vite 产物带 hash，可长缓存）----
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ---- 后端接口（含 SSE 流式问答）----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE / 大文件下载：关闭缓冲与缓存，放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 健康检查直通（便于 docker healthcheck / 运维探活）----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- SPA 入口 ----
    # index.html 不缓存：它引用的是带 hash 的产物，一旦被浏览器缓存，
    # 发版后用户仍会加载旧 bundle（表现为改了路由/页面却"没生效"）。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        # 入口文档（index.html 及 SPA 回退）一律不缓存，发版后立即生效
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
