# pytest 配置（docs/09 §2）
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: 纯单元测试，无外部依赖
    integration: 需要 MySQL / Milvus
    llm: 需要真实大模型 API（默认跳过）
    slow: 耗时超过 5 秒
addopts = -q --strict-markers --asyncio-mode=auto -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
